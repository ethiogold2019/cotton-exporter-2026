<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Cotton Exporter - Admin Control System</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
body { background:#f5f7fb; padding:0; margin:0; min-height:100vh; display:flex; flex-direction:column; }
.auth-container, .app-container { max-width:550px; margin:0 auto; width:100%; background:white; min-height:100vh; box-shadow:0 0 20px rgba(0,0,0,0.05); position:relative; }
.auth-container { display:flex; flex-direction:column; justify-content:center; padding:2rem 1.5rem; }
.app-container { display:none; padding-bottom:70px; }
.header { padding:1.2rem 1rem; background:white; border-bottom:1px solid #eef2f6; position:sticky; top:0; z-index:10; display:flex; justify-content:space-between; align-items:center;}
.header h1 { font-size:1.5rem; font-weight:700; color:#1e3a5f; }
.header p { font-size:0.75rem; color:#6c7a89; }
.form-group { margin-bottom:1.2rem; }
label { display:block; font-size:0.85rem; font-weight:600; margin-bottom:0.4rem; color:#1e3a5f; }
input, select, textarea { width:100%; padding:0.8rem 1rem; border:1px solid #cfdfed; border-radius:2rem; font-size:0.95rem; background:white; outline:none; }
textarea { border-radius:1rem; }
.btn { width:100%; background:#1e3a5f; color:white; border:none; padding:0.85rem; border-radius:3rem; font-weight:bold; font-size:1rem; cursor:pointer; }
.btn-outline { background:transparent; border:1px solid #1e3a5f; color:#1e3a5f; }
.btn-danger { background:#dc2626; color:white; }
.btn-success { background:#16a34a; color:white; }
.btn-warning { background:#f59e0b; color:white; }
.toggle-link { text-align:center; margin-top:1rem; font-size:0.85rem; }
.toggle-link a { color:#2c7da0; text-decoration:none; font-weight:600; }

.balance-card { background:linear-gradient(135deg,#1e3a5f,#0f2c48); color:white; border-radius:1.5rem; padding:1.2rem; margin:1rem; text-align:center; }
.balance-amount { font-size:2rem; font-weight:bold; margin:0.5rem 0; color:#10b981; }
.recharge-wallet { color:#ef4444; }
.action-btn-recharge { background:#ef4444; color:white; padding:0.5rem; border-radius:1rem; border:none; margin:0.2rem; font-weight:bold;}
.action-btn-withdraw { background:#f59e0b; color:white; padding:0.5rem; border-radius:1rem; border:none; margin:0.2rem; font-weight:bold;}

.products-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:1rem; padding:1rem; }
.product-card { background:white; border-radius:1.25rem; padding:1rem; box-shadow:0 8px 20px rgba(0,0,0,0.05); border:1px solid #eef2f6; text-align:center; }
.product-card h4 { font-size:1.2rem; font-weight:700; color:#1e3a5f; margin-bottom:0.5rem; }
.product-price { font-size:1.3rem; font-weight:800; color:#d97706; margin:0.25rem 0; }
.product-detail { font-size:0.75rem; color:#4b5563; display:flex; justify-content:space-between; margin-top:0.3rem; }
.invest-now { margin-top:0.75rem; width:100%; background:#1e3a5f; color:white; border:none; padding:0.5rem; border-radius:2rem; font-weight:600; cursor:pointer; }

.bottom-nav { position:fixed; bottom:0; left:0; right:0; max-width:550px; margin:0 auto; background:white; display:flex; justify-content:space-around; padding:0.6rem 0.5rem; border-top:1px solid #eef2f6; z-index:20; }
.nav-item { text-align:center; flex:1; cursor:pointer; font-size:0.7rem; color:#8a9bb0; }
.nav-item.active { color:#1e3a5f; font-weight:bold; }
.nav-icon { font-size:1.4rem; display:block; }

.page { display:none; padding:0.5rem 1rem 1rem; }
.page.active { display:block; }

.order-card, .transaction-item { background:#f9fbfd; border-radius:1rem; padding:0.8rem; margin-bottom:0.8rem; border:1px solid #eef2f6; }
.wealth-stats { background:#eef2f9; border-radius:1rem; padding:1rem; margin:1rem 0; }
.flex-between { display:flex; justify-content:space-between; align-items:center; }
.tag { background:#cfdfed; padding:0.2rem 0.6rem; border-radius:2rem; font-size:0.7rem; }
.tag-red { background:#fecaca; color:#991b1b; }
.tag-green { background:#bbf7d0; color:#166534; }
.tag-yellow { background:#fef08a; color:#854d0e; }
.copy-btn { background:#2c7da0; color:white; border:none; padding:0.2rem 0.6rem; border-radius:2rem; font-size:0.7rem; cursor:pointer; margin-left:0.5rem; }
.video-timer { background:#fef3c7; padding:0.5rem; border-radius:2rem; text-align:center; margin-top:0.5rem; }
.modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; z-index:1000; overflow-y:auto; padding:1rem; }
.modal-content { background:white; width:100%; max-width:400px; border-radius:1.5rem; padding:1.5rem; max-height:90vh; overflow-y:auto; }
.warning { color:#d97706; font-size:0.75rem; }
.text-center { text-align:center; }
.mt-1 { margin-top:0.25rem; } .mt-2 { margin-top:0.5rem; } .mt-3 { margin-top:1rem; }
.mb-2 { margin-bottom:0.5rem; }

.flower-border-box { position:relative; padding:1.5rem 1.2rem; margin:1.5rem 0; border:none !important; border-radius:1rem; background-color:#fff; z-index:1; box-shadow:0 4px 15px rgba(0,0,0,0.05); }
.flower-border-box::before { content:""; position:absolute; top:-12px; left:-12px; right:-12px; bottom:-12px; border-radius:1.2rem; background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><text x="0" y="18" font-size="18">🌺</text></svg>'),url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><text x="0" y="18" font-size="18">💛</text></svg>'),url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><text x="0" y="18" font-size="18">🌼</text></svg>'),url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><text x="0" y="18" font-size="18">💚</text></svg>'); background-position:top left,top right,bottom left,bottom right; background-repeat:repeat-x; background-size:24px 24px; z-index:-1; }
.flower-border-box::after { content:""; position:absolute; top:0; left:-12px; right:-12px; bottom:0; border-radius:1.2rem; background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><text x="0" y="18" font-size="18">🌺</text></svg>'),url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><text x="0" y="18" font-size="18">💛</text></svg>'),url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><text x="0" y="18" font-size="18">🌼</text></svg>'),url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><text x="0" y="18" font-size="18">💚</text></svg>'); background-position:top left,top right,bottom left,bottom right; background-repeat:repeat-y; background-size:24px 24px; z-index:-1; }

.wealth-bg { background-color:#e0f2fe !important; }
.task-bg-black { background-color:#f3f4f6 !important; }
.task-bg-red { background-color:#fef2f2 !important; }
.task-bg-yellow { background-color:#fefce8 !important; }
.mine-bg-blue { background-color:#e0f2fe !important; }
.mine-bg-green { background-color:#dcfce7 !important; }
.admin-bg { background-color:#fef3c7 !important; border:2px dashed #f59e0b !important; }

.dotted-blue-btn { background:transparent; border:2px dotted #3b82f6 !important; color:#10b981; border-radius:2rem; padding:0.5rem 1rem; font-weight:600; cursor:pointer; width:100%; text-align:center; margin-top:0.5rem; }
.dotted-blue-btn:hover { background:#e0f2fe; }

/* Admin specific */
.admin-tabs { display:flex; gap:0.3rem; margin:1rem 0; overflow-x:auto; padding-bottom:0.3rem; }
.admin-tab { padding:0.5rem 0.8rem; background:#f1f5f9; border-radius:2rem; font-size:0.75rem; font-weight:600; white-space:nowrap; cursor:pointer; border:none; }
.admin-tab.active { background:#1e3a5f; color:white; }
.user-row { background:white; border:1px solid #eef2f6; border-radius:0.8rem; padding:0.7rem; margin-bottom:0.5rem; font-size:0.8rem; }
.user-row .name { font-weight:700; color:#1e3a5f; }
.user-actions { display:flex; gap:0.3rem; flex-wrap:wrap; margin-top:0.5rem; }
.user-actions button { font-size:0.65rem; padding:0.3rem 0.5rem; border-radius:1rem; border:none; cursor:pointer; }
.badge-unread { background:#dc2626; color:white; font-size:0.6rem; padding:0.15rem 0.4rem; border-radius:2rem; margin-left:0.3rem; }
.admin-stat-card { background:linear-gradient(135deg,#1e3a5f,#2c5282); color:white; border-radius:1rem; padding:1rem; margin-bottom:0.8rem; }
.admin-stat-card .num { font-size:1.5rem; font-weight:800; color:#10b981; }
.search-box { width:100%; padding:0.6rem 1rem; border-radius:2rem; border:1px solid #cfdfed; margin-bottom:0.5rem; }
.pending-item { background:#fef3c7; border:1px solid #f59e0b; border-radius:0.8rem; padding:0.7rem; margin-bottom:0.5rem; font-size:0.8rem; }
</style>
</head>
<body>

<!-- Authentication Container -->
<div id="authContainer" class="auth-container">
    <div id="loginForm" style="display:none;">
        <h2 style="text-align:center;">Cotton Exporter</h2>
        <p class="text-center" style="margin-bottom:1.5rem;">Sign in to your account</p>
        <div class="form-group"><label>📞 Phone Number</label><input type="tel" id="loginPhone" placeholder="+251 912345678"></div>
        <div class="form-group"><label>🔒 Password</label><input type="password" id="loginPassword" placeholder="Enter password"></div>
        <button id="doLogin" class="btn">Login</button>
        <div class="toggle-link">Don't have an account? <a href="#" id="showRegister">Sign up</a></div>
        <div id="loginMessage" class="warning text-center mt-2"></div>
    </div>

    <div id="registerForm" style="display:block;">
        <h2 style="text-align:center;">Cotton Exporter</h2>
        <p class="text-center">Create an account to start investing</p>
        <div class="form-group"><label>📞 Phone Number</label><input type="tel" id="regPhone" placeholder="+251 912345678"></div>
        <div class="form-group"><label>👤 Full Name</label><input type="text" id="fullName" placeholder="Full name"></div>
        <div class="form-group"><label>🔒 Login Password</label><input type="password" id="regPassword" placeholder="Password"></div>
        <div class="form-group"><label>✅ Confirm Password</label><input type="password" id="confirmPassword" placeholder="Confirm password"></div>
        <div class="form-group"><label>🔐 6-Digit Pay Password</label><input type="password" id="payPassword" maxlength="6" placeholder="6 digits"></div>
        <div class="form-group"><label>🔗 Invite Code (Optional)</label><input type="text" id="inviteCodeReg" placeholder="Enter sponsor code"></div>
        <button id="doRegister" class="btn">Sign Up</button>
        <div class="toggle-link">Already have an account? <a href="#" id="showLogin">Sign in</a></div>
        <div id="regMessage" class="warning text-center mt-2"></div>
    </div>
</div>

<!-- Main App Container -->
<div id="appContainer" class="app-container">
    <div class="header">
        <div>
            <h1>Cotton Exporter</h1>
            <p>The first checkpoint of quality control</p>
        </div>
        <button id="adminBtn" style="display:none; background:#f59e0b; color:white; border:none; padding:0.4rem 0.7rem; border-radius:1rem; font-size:0.7rem; font-weight:bold; cursor:pointer;">⚙️ Admin</button>
    </div>

    <div id="homePage" class="page active"></div>
    <div id="wealthPage" class="page"></div>
    <div id="taskPage" class="page"></div>
    <div id="minePage" class="page"></div>
    <div id="adminPage" class="page"></div>

    <div class="bottom-nav">
        <div class="nav-item active" data-page="home"><span class="nav-icon">🏠</span><br>Home</div>
        <div class="nav-item" data-page="wealth"><span class="nav-icon">💰</span><br>Wealth</div>
        <div class="nav-item" data-page="task"><span class="nav-icon">📋</span><br>Task</div>
        <div class="nav-item" data-page="mine"><span class="nav-icon">👤</span><br>Mine</div>
    </div>
</div>

<!-- Modals -->
<div id="rechargeModal" class="modal"></div>
<div id="withdrawModal" class="modal"></div>
<div id="investModal" class="modal"></div>
<div id="cashGiftModal" class="modal"></div>
<div id="exchangeModal" class="modal"></div>
<div id="adminActionModal" class="modal"></div>

<script>
// ============ DATA ============
let currentUser = null;
let users = [];
let investments = [];
let transactions = [];
let giftCodes = [];
let validFTTransactions = [];
let adminActions = []; // log of admin actions
let settings = { minWithdraw:300, referralBonus:50, siteName:'Cotton Exporter' };

const ADMIN_PHONE = "0947655291"; // demo admin (also a demo user)
const ADMIN_PASSWORD = "123456";

const PRODUCTS = {
    young: { name:"Young", price:1000, totalReturn:1800, daily:40, days:45, icon:"🌱" },
    bestOne: { name:"Best One", price:2500, totalReturn:4840, daily:110, days:44, icon:"⭐" },
    onlyEthiopians: { name:"Only For Ethiopians", price:5000, totalReturn:9900, daily:220, days:45, icon:"🇪🇹" },
    mandheling: { name:"Mandheling", price:8000, totalReturn:15300, daily:340, days:45, icon:"☕" },
    antigua: { name:"Antigua", price:20000, totalReturn:45000, daily:1000, days:45, icon:"🏝️" },
    tarrazu: { name:"Tarrazú", price:40000, totalReturn:100000, daily:2500, days:40, icon:"⛰️" }
};

// ============ STORAGE ============
function saveData() {
    localStorage.setItem("cotton_users", JSON.stringify(users));
    localStorage.setItem("cotton_investments", JSON.stringify(investments));
    localStorage.setItem("cotton_transactions", JSON.stringify(transactions));
    localStorage.setItem("cotton_giftcodes", JSON.stringify(giftCodes));
    localStorage.setItem("cotton_ft_transactions", JSON.stringify(validFTTransactions));
    localStorage.setItem("cotton_admin_actions", JSON.stringify(adminActions));
    localStorage.setItem("cotton_settings", JSON.stringify(settings));
}

function loadData() {
    try {
        let u = localStorage.getItem("cotton_users"); if (u) users = JSON.parse(u);
        let inv = localStorage.getItem("cotton_investments"); if (inv) investments = JSON.parse(inv);
        let tr = localStorage.getItem("cotton_transactions"); if (tr) transactions = JSON.parse(tr);
        let gc = localStorage.getItem("cotton_giftcodes"); if (gc) giftCodes = JSON.parse(gc);
        let ft = localStorage.getItem("cotton_ft_transactions"); if (ft) validFTTransactions = JSON.parse(ft);
        let aa = localStorage.getItem("cotton_admin_actions"); if (aa) adminActions = JSON.parse(aa);
        let st = localStorage.getItem("cotton_settings"); if (st) settings = JSON.parse(st);
    } catch(e) { console.error(e); }

    if (users.length === 0) {
        users.push({
            phone: ADMIN_PHONE, fullName:"Demo Admin", password: ADMIN_PASSWORD, payPassword:"123456",
            inviteCode: generateInviteCode(), referredBy:null,
            balance:5000, rechargeBalance:5000, wealthWallet:0, rewardWallet:0, totalEarnings:0,
            vipLevel:0, lastDailyBonus:null, lastVideoTaskDate:null,
            shareReferralCount:0, shareRewardClaimed:false, isAdmin:true,
            isBanned:false, banUntil:null, banReason:"", createdAt:new Date().toISOString(),
            isReadByAdmin:true, linkedReferralLinkBlocked:false, referralBlockUntil:null,
            rechargeHistory:[], rejectedRecharges:0
        });
    }
    for (let u of users) {
        if (u.rechargeBalance === undefined) u.rechargeBalance = 0;
        if (u.lastVideoTaskDate === undefined) u.lastVideoTaskDate = null;
        if (u.isBanned === undefined) u.isBanned = false;
        if (u.banUntil === undefined) u.banUntil = null;
        if (u.isReadByAdmin === undefined) u.isReadByAdmin = true;
        if (u.rechargeHistory === undefined) u.rechargeHistory = [];
        if (u.rejectedRecharges === undefined) u.rejectedRecharges = 0;
        if (u.isAdmin === undefined) u.isAdmin = (u.phone === ADMIN_PHONE);
        if (u.linkedReferralLinkBlocked === undefined) u.linkedReferralLinkBlocked = false;
        if (u.referralBlockUntil === undefined) u.referralBlockUntil = null;
    }
    saveData();
}

function generateInviteCode() { return Math.random().toString(36).substring(2,8).toUpperCase(); }

function addTransaction(userPhone, type, amount, desc, extra) {
    let tx = { id:Date.now()+Math.random(), userPhone, type, amount, description:desc, timestamp:new Date().toISOString() };
    if (extra) Object.assign(tx, extra);
    transactions.unshift(tx);
    saveData();
    return tx;
}

// ============ BAN CHECK ============
function isUserBanned(user) {
    if (!user) return false;
    if (user.isBanned && (!user.banUntil || new Date(user.banUntil) > new Date())) return true;
    if (user.isBanned && user.banUntil && new Date(user.banUntil) <= new Date()) {
        user.isBanned = false;
        user.banUntil = null;
        user.banReason = "";
        saveData();
    }
    return false;
}

// ============ DAILY INCOME ============
function processDailyIncomes() {
    let now = new Date();
    for (let inv of investments) {
        let user = users.find(u => u.phone === inv.userPhone);
        if (!user || isUserBanned(user)) continue;
        let last = new Date(inv.lastIncomeDate);
        let daysDiff = Math.floor((now - last)/86400000);
        if (daysDiff > 0 && inv.daysLeft > 0) {
            let income = inv.dailyRate * daysDiff;
            if (income > 0) {
                user.wealthWallet += income;
                user.totalEarnings += income;
                inv.lastIncomeDate = now.toISOString();
                inv.daysLeft -= daysDiff;
                addTransaction(user.phone, "income", income, `Daily income from ${inv.productName}`);
                let referrer = users.find(u => u.phone === user.referredBy);
                if (referrer && !isUserBanned(referrer)) {
                    let pct = referrer.vipLevel===1?0.05:referrer.vipLevel===2?0.09:referrer.vipLevel===3?0.12:0;
                    if (pct>0) {
                        let c = income*pct;
                        referrer.wealthWallet += c;
                        referrer.totalEarnings += c;
                        addTransaction(referrer.phone,"commission",c,`Team commission from ${user.fullName}`);
                    }
                }
            }
            saveData();
        }
    }
    for (let u of users) {
        let hasPurchase = investments.some(i => i.userPhone === u.phone);
        let rc = users.filter(usr => usr.referredBy === u.phone).length;
        if (rc>=20 && hasPurchase) u.vipLevel=3;
        else if (rc>=5 && hasPurchase) u.vipLevel=2;
        else if (hasPurchase) u.vipLevel=1;
        else u.vipLevel=0;
    }
    saveData();
}

function refreshAllUI() {
    if (!currentUser) return;
    processDailyIncomes();
    renderHomePage();
    renderWealthPage();
    renderTaskPage();
    renderMinePage();
    if (isCurrentUserAdmin()) renderAdminPage();
}

function isCurrentUserAdmin() {
    let u = users.find(u => u.phone === currentUser);
    return u && u.isAdmin === true;
}

// ============ HOME ============
function renderHomePage() {
    let user = users.find(u => u.phone === currentUser);
    if (!user) return;
    if (isUserBanned(user)) {
        document.getElementById("homePage").innerHTML = `
            <div class="flower-border-box task-bg-red" style="margin:2rem 1rem; text-align:center;">
                <h2>🚫 Account Suspended</h2>
                <p>${user.banReason || 'Your account is suspended.'}</p>
                <p>Until: ${user.banUntil ? new Date(user.banUntil).toLocaleString() : 'Permanent'}</p>
            </div>`;
        return;
    }
    let unreadCount = 0;
    document.getElementById("homePage").innerHTML = `
        <div class="balance-card">
            <div>${settings.siteName} - The first checkpoint</div>
            <div class="balance-amount">${user.balance.toFixed(2)} ETB</div>
            <div>Wallet Balance</div>
            <div style="margin-top:0.5rem; display:flex; justify-content:center; gap:10px;">
                <button class="action-btn-recharge" id="openRecharge">➕ Recharge</button>
                <button class="action-btn-withdraw" id="openWithdraw">➖ Withdraw</button>
            </div>
            <div style="margin-top:0.5rem; font-size:0.8rem;">💰 Recharge Wallet: <span class="recharge-wallet">${user.rechargeBalance.toFixed(2)} ETB</span></div>
        </div>
        <h3 style="margin:1rem 0 0 1rem;">📈 Investment Products</h3>
        <div class="products-grid" id="productsGrid"></div>`;
    let grid = document.getElementById("productsGrid");
    for (let [key, prod] of Object.entries(PRODUCTS)) {
        let card = document.createElement("div");
        card.className = "product-card";
        card.innerHTML = `
            <h4>${prod.icon} ${prod.name}</h4>
            <div class="product-price">${prod.price.toLocaleString()} ETB</div>
            <div class="product-detail"><span>Total:</span><span>${prod.totalReturn.toLocaleString()} ETB</span></div>
            <div class="product-detail"><span>Daily:</span><span>${prod.daily} ETB</span></div>
            <div class="product-detail"><span>${prod.days} Days</span></div>
            <button class="invest-now" data-product="${key}">Invest Now</button>`;
        grid.appendChild(card);
    }
    document.querySelectorAll(".invest-now").forEach(btn => {
        btn.onclick = () => openInvestModal(btn.dataset.product);
    });
    document.getElementById("openRecharge").onclick = () => document.getElementById("rechargeModal").style.display="flex";
    document.getElementById("openWithdraw").onclick = () => {
        document.getElementById("withdrawableBalance").innerText = user.balance.toFixed(2);
        document.getElementById("withdrawModal").style.display="flex";
    };
}

// ============ WEALTH ============
function renderWealthPage() {
    let user = users.find(u => u.phone === currentUser);
    if (isUserBanned(user)) { document.getElementById("wealthPage").innerHTML=""; return; }
    let userInvestments = investments.filter(i => i.userPhone === currentUser);
    let lastBonus = user.lastDailyBonus ? new Date(user.lastDailyBonus) : null;
    let now = new Date();
    let canReceive = !lastBonus || (now-lastBonus) >= 86400000;
    let status = canReceive ? "✅ Ready to claim" : `⏳ Next: ${new Date(lastBonus.getTime()+86400000).toLocaleString()}`;
    document.getElementById("wealthPage").innerHTML = `
        <div class="flower-border-box wealth-bg">
            <div class="flex-between"><span>Wealth Wallet</span><span>${user.wealthWallet.toFixed(2)} ETB</span></div>

function adminLog(action) {
    adminActions.unshift({ id:Date.now(), action, by:currentUser, timestamp:new Date().toISOString() });
    saveData();
}

// ============ ADMIN ACTIONS (global) ============
window.adminAdjustBalance = function(phone) {
    let u = users.find(x=>x.phone===phone);
    if (!u) return;
    let val = prompt(`Adjust balance for ${u.fullName}\nCurrent: ${u.balance} ETB\nEnter amount (+add / -subtract):`);
    if (val===null) return;
    let n = parseFloat(val);
    if (isNaN(n)) { alert("Invalid"); return; }
    u.balance += n;
    if (u.balance<0) u.balance=0;
    addTransaction(phone, n>=0?"admin_credit":"admin_debit", n, `Admin ${n>=0?"credit":"debit"}`);
    adminLog(`${n>=0?"Added":"Deducted"} ${Math.abs(n)} ETB ${n>=0?"to":"from"} ${u.fullName}`);
    saveData(); renderAdminTab("users");
    alert("Balance updated!");
};

window.adminBanUser = function(phone) {
    let u = users.find(x=>x.phone===phone);
    if (!u) return;
    if (u.isBanned) {
        u.isBanned=false; u.banUntil=null; u.banReason="";
        adminLog(`Unbanned ${u.fullName}`);
    } else {
        let reason = prompt("Ban reason:") || "Policy violation";
        let hours = prompt("Ban duration (hours, 0 = permanent):", "24");
        if (hours===null) return;
        let h = parseFloat(hours)||0;
        u.isBanned=true;
        u.banUntil = h>0 ? new Date(Date.now()+h*3600000).toISOString() : null;
        u.banReason = reason;
        adminLog(`Banned ${u.fullName} for ${h>0?h+'h':'permanent'} — ${reason}`);
    }
    saveData(); renderAdminTab("users");
};

window.adminDeleteUser = function(phone) {
    let u = users.find(x=>x.phone===phone);
    if (!u) return;
    if (!confirm(`Delete ${u.fullName} (${u.phone})? This cannot be undone.`)) return;
    users = users.filter(x=>x.phone!==phone);
    investments = investments.filter(i=>i.userPhone!==phone);
    adminLog(`Deleted user ${u.fullName} (${phone})`);
    saveData(); renderAdminTab("users");
};

    }
    saveData(); renderAdminTab("users");
};

window.adminRechargeAction = function(txId, status) {
    let tx = transactions.find(t=>String(t.id)===String(txId));
    if (!tx) return;
    let u = users.find(x=>x.phone===tx.userPhone);
    if (!u) return;
    if (status==="rejected") {
        // refund
        u.balance -= tx.amount;
        if (u.balance<0) u.balance=0;
        u.rejectedRecharges = (u.rejectedRecharges||0)+1;
        tx.status = "rejected";
        tx.description += " [REJECTED & REFUNDED]";
        adminLog(`Rejected recharge of ${tx.amount} ETB for ${u.fullName} and refunded`);
        alert("Rejected & refunded to user's account balance.");
    } else {
        tx.status = "success";
        adminLog(`Approved recharge of ${tx.amount} ETB for ${u.fullName}`);
        alert("Marked as success.");
    }
    saveData(); renderAdminTab("recharges");
};

window.toggleGift = function(code) {
    let g = giftCodes.find(x=>x.code===code);
    if (!g) return;
    g.active = g.active===false ? true : false;
    saveData(); renderAdminTab("gifts");
};
window.deleteGift = function(code) {
    if (!confirm("Delete gift code?")) return;
    giftCodes = giftCodes.filter(x=>x.code!==code);
    saveData(); renderAdminTab("gifts");
};

// ============ INVEST ============
function openInvestModal(productKey) {
    let prod = PRODUCTS[productKey];
    let user = users.find(u=>u.phone===currentUser);
    if (isUserBanned(user)) { alert("Account suspended."); return; }
    document.getElementById("investProductName").innerText = `${prod.icon} ${prod.name}`;
    document.getElementById("investDetails").innerHTML = `Price: ${prod.price} ETB<br>Daily: ${prod.daily} ETB<br>Total Return: ${prod.totalReturn} ETB<br>Period: ${prod.days} Days<br>Available: ${user.balance.toFixed(2)} ETB`;
    document.getElementById("investPayPassword").value="";
    document.getElementById("investError").innerText="";
    let modal = document.getElementById("investModal");
    modal.style.display="flex";
    document.getElementById("confirmInvest").onclick = () => {
        let pp = document.getElementById("investPayPassword").value;
        if (pp!==user.payPassword) { document.getElementById("investError").innerText="❌ Incorrect pay password"; return; }
        if (user.balance<prod.price) { document.getElementById("investError").innerText="❌ Insufficient balance"; return; }
        user.balance -= prod.price;
        if (user.rechargeBalance>=prod.price) user.rechargeBalance -= prod.price;
        else user.rechargeBalance = 0;
        investments.push({ id:Date.now(), userPhone:currentUser, productKey, productName:prod.name,
            amount:prod.price, startDate:new Date().toISOString(), lastIncomeDate:new Date().toISOString(),
            dailyRate:prod.daily, daysLeft:prod.days, totalReturn:prod.totalReturn });
        addTransaction(currentUser,"invest",-prod.price,`Purchased ${prod.name}`);
        saveData(); modal.style.display="none"; refreshAllUI();
        alert(`Invested in ${prod.name}!`);
    };
    document.getElementById("closeInvestModal").onclick = () => modal.style.display="none";
}

// ============ URL ============
function getUrlParameter(name) {
    let regex = new RegExp('[?&]'+name+'=([^&#]*)');
    let results = regex.exec(window.location.href);
    return results===null?null:decodeURIComponent(results[1].replace(/\+/g,' '));
}

    document.getElementById("loginForm").style.display="none";

    let ref = getUrlParameter("ref");
    if (ref) document.getElementById("inviteCodeReg").value = ref;
};

    document.getElementById("loginForm").style.display="block";

// ============ REGISTER ============
document.getElementById("doRegister").onclick = () => {
    let phone = document.getElementById("regPhone").value.trim();
    let fullName = document.getElementById("fullName").value.trim();
    let pass = document.getElementById("regPassword").value;
    let conf = document.getElementById("confirmPassword").value;
    let pp = document.getElementById("payPassword").value;
    let invite = document.getElementById("inviteCodeReg").value.trim().toUpperCase();
    if (!phone||!fullName||!pass||!conf||!pp) { document.getElementById("regMessage").innerText="Fill all fields"; return; }
    if (pass!==conf) { document.getElementById("regMessage").innerText="Passwords mismatch"; return; }
    if (pp.length!==6||isNaN(pp)) { document.getElementById("regMessage").innerText="Pay password 6 digits"; return; }
    if (users.find(u=>u.phone===phone)) { document.getElementById("regMessage").innerText="Phone registered"; return; }
    let referredBy = null;
    if (invite) {
        let refUser = users.find(u=>u.inviteCode===invite);
        if (!refUser) { document.getElementById("regMessage").innerText="Invalid invite code"; return; }
        // check if referral link is blocked
        if (refUser.linkedReferralLinkBlocked && refUser.referralBlockUntil && new Date(refUser.referralBlockUntil)>new Date()) {
            document.getElementById("regMessage").innerText="Invite code temporarily blocked";
            return;
        }
        referredBy = refUser.phone;
    }
    let newUser = {
        phone, fullName, password:pass, payPassword:pp,
        inviteCode:generateInviteCode(), referredBy,
        balance:0, rechargeBalance:0, wealthWallet:0, rewardWallet:0, totalEarnings:0,
        vipLevel:0, lastDailyBonus:null, lastVideoTaskDate:null,
        shareReferralCount:0, shareRewardClaimed:false,
        isAdmin:false, isBanned:false, banUntil:null, banReason:"",
        isReadByAdmin:false, linkedReferralLinkBlocked:false, referralBlockUntil:null,
        rechargeHistory:[], rejectedRecharges:0,
        createdAt:new Date().toISOString()
    };
    users.push(newUser);
    saveData();
    if (referredBy) {
        let r = users.find(u=>u.phone===referredBy);
        if (r) {
            r.shareReferralCount = (r.shareReferralCount||0)+1;
            if (r.shareReferralCount>=2 && !r.shareRewardClaimed) {
                r.shareRewardClaimed=true;
                r.rewardWallet = (r.rewardWallet||0)+settings.referralBonus;
                addTransaction(referredBy,"share_task",settings.referralBonus,"Share task reward (2 referrals)");
            }
            saveData();
        }
    }
    alert("Registered! Please login.");
    document.getElementById("registerForm").style.display="none";
    document.getElementById("loginForm").style.display="block";
    document.getElementById("regMessage").innerText="";
};

// ============ LOGIN ============
document.getElementById("doLogin").onclick = () => {
    let phone = document.getElementById("loginPhone").value.trim();
    let pass = document.getElementById("loginPassword").value;
    let user = users.find(u=>u.phone===phone && u.password===pass);
    if (!user) { document.getElementById("loginMessage").innerText="Invalid credentials. Demo: 0947655291 / 123456"; return; }
    if (isUserBanned(user)) {
        document.getElementById("loginMessage").innerText=`Account suspended: ${user.banReason||''} ${user.banUntil?('until '+new Date(user.banUntil).toLocaleString()):'(permanent)'}`;
        return;
    }
    currentUser = phone;
    document.getElementById("authContainer").style.display="none";
    document.getElementById("appContainer").style.display="block";
    document.getElementById("adminBtn").style.display = user.isAdmin ? "block" : "none";
    refreshAllUI();
    document.querySelector(".nav-item[data-page='home']").click();
};

    document.getElementById("rechargeModal").innerHTML = `<div class="modal-content">
        <div class="modal-header">💳 Recharge Wallet</div>
        <p>Bank: Commercial Bank of Ethiopia</p>
        <div class="form-group"><label>Account Name</label><div style="display:flex;"><input type="text" id="bankAccountName" value="Cotton Exporter PLC" readonly><button id="copyAccountName" class="copy-btn">Copy</button></div></div>
        <div class="form-group"><label>Account Number</label><div style="display:flex;"><input type="text" id="bankAccountNumber" value="1000123456789" readonly><button id="copyAccountNumber" class="copy-btn">Copy</button></div></div>
        <div class="form-group"><label>Amount (ETB)</label><input type="number" id="rechargeAmount" placeholder="Enter amount"></div>
        <div class="form-group"><label>FT Reference Code</label><input type="text" id="ftCode" placeholder="e.g., FT26110L6GG0"></div>
        <div class="form-group"><label>Cheque / Transaction Number</label><input type="text" id="chequeNum" placeholder="Transaction number"></div>
        <button id="confirmRecharge" class="btn">Submit</button>
        <button class="btn-outline mt-2" id="closeRechargeModal">Cancel</button>
    </div>`;
    document.getElementById("withdrawModal").innerHTML = `<div class="modal-content">
        <div class="modal-header">💸 Withdraw</div>
        <p>Withdrawable: <span id="withdrawableBalance">0</span> ETB<br>Min: ${settings.minWithdraw} ETB</p>
        <div class="form-group"><label>Amount</label><input type="number" id="withdrawAmount"></div>
        <div class="form-group"><label>Account Name</label><input id="withdrawAccountName"></div>
        <div class="form-group"><label>CBE Account</label><input id="withdrawAccountNumber"></div>
        <div class="form-group"><label>Pay Password</label><input type="password" id="withdrawPayPassword" maxlength="6"></div>
        <button id="confirmWithdraw" class="btn">Submit</button>
        <button class="btn-outline mt-2" id="closeWithdrawModal">Cancel</button>
    </div>`;
    document.getElementById("investModal").innerHTML = `<div class="modal-content">
        <div class="modal-header" id="investProductName"></div>
        <p id="investDetails"></p>
        <div class="form-group"><label>Pay Password</label><input type="password" id="investPayPassword" maxlength="6"></div>
        <button id="confirmInvest" class="btn">Buy Now</button>
        <button class="btn-outline mt-2" id="closeInvestModal">Cancel</button>
        <div id="investError" class="warning"></div>
    </div>`;
    document.getElementById("cashGiftModal").innerHTML = `<div class="modal-content">
        <div class="modal-header">🎁 Cash Gift</div>
        <input type="text" id="giftCode" placeholder="Redemption code">
        <button id="claimGift" class="btn mt-2">Claim</button>
        <button class="btn-outline mt-2" id="closeGiftModal">Cancel</button>
    </div>`;
    document.getElementById("exchangeModal").innerHTML = `<div class="modal-content">
        <div class="modal-header">🔄 Exchange</div>
        <p>Wealth: <span id="wealthWalletAmount">0</span> ETB</p>
        <div class="form-group"><label>Amount</label><input type="number" id="exchangeAmount"></div>
        <button id="confirmExchange" class="btn">Exchange</button>
        <button class="btn-outline mt-2" id="closeExchangeModal">Cancel</button>
    </div>`;

    setTimeout(() => {
        document.getElementById("confirmRecharge").onclick = () => {
            let ft = document.getElementById("ftCode").value.trim().toUpperCase();
            let amount = parseFloat(document.getElementById("rechargeAmount").value);
            let cheque = document.getElementById("chequeNum").value.trim().toUpperCase();
            if (!ft) { alert("Enter FT Code"); return; }
            if (!cheque) { alert("Enter transaction number"); return; }
            if (isNaN(amount)||amount<=0) { alert("Enter valid amount"); return; }
            let isUsed = validFTTransactions.some(t=>t.code===ft||t.cheque===cheque);
            if (isUsed) { alert("❌ Code/Cheque already used"); return; }
            validFTTransactions.push({ code:ft, cheque, amount, usedBy:currentUser });
            let user = users.find(u=>u.phone===currentUser);
            // simulate network: create transaction as pending (admin can reject/approve)
            let tx = addTransaction(currentUser,"recharge",amount,`Recharge via FT ${ft} (${amount} ETB)`,{ status:"pending" });
            user.rechargeHistory.push({ amount, ft, cheque, timestamp:new Date().toISOString(), status:"pending" });
            // ✅ immediately add balance, but mark transaction pending (admin may reject/refund)
            user.balance += amount;
            user.rechargeBalance += amount;
            saveData(); refreshAllUI();
            document.getElementById("rechargeModal").style.display="none";
            alert(`✅ Recharge of ${amount} ETB submitted! Balance credited.`);
        };
        document.getElementById("closeRechargeModal").onclick = () => document.getElementById("rechargeModal").style.display="none";
        document.getElementById("copyAccountName").onclick = () => { navigator.clipboard.writeText("Cotton Exporter PLC"); alert("Copied!"); };
        document.getElementById("copyAccountNumber").onclick = () => { navigator.clipboard.writeText("1000123456789"); alert("Copied!"); };
        document.getElementById("confirmWithdraw").onclick = () => {
            let amount = parseFloat(document.getElementById("withdrawAmount").value);
            let accName = document.getElementById("withdrawAccountName").value;
            let accNum = document.getElementById("withdrawAccountNumber").value;
            let pp = document.getElementById("withdrawPayPassword").value;
            let user = users.find(u=>u.phone===currentUser);
            if (isNaN(amount)||amount<settings.minWithdraw) alert(`Min ${settings.minWithdraw} ETB`);
            else if (user.balance<amount) alert("Insufficient");
            else if (pp!==user.payPassword) alert("Incorrect pay password");
            else if (!accName||!accNum) alert("Enter bank details");
            else {
                user.balance -= amount;
                addTransaction(currentUser,"withdraw",-amount,`Withdrawal to ${accName} - ${accNum}`);
                saveData(); refreshAllUI();
                document.getElementById("withdrawModal").style.display="none";
                alert(`Withdrawal of ${amount} ETB submitted.`);
            }
        };
        document.getElementById("closeWithdrawModal").onclick = () => document.getElementById("withdrawModal").style.display="none";
        document.getElementById("closeInvestModal").onclick = () => document.getElementById("investModal").style.display="none";
        document.getElementById("claimGift").onclick = () => {
            let code = document.getElementById("giftCode").value.trim().toUpperCase();
            let gift = giftCodes.find(g=>g.code===code);
            if (!gift) { alert("Invalid"); return; }
            if (gift.usedBy) { alert("Used"); return; }
            if (gift.active===false) { alert("Blocked"); return; }
            if (gift.expiresAt && new Date(gift.expiresAt)<new Date()) { alert("Expired"); return; }
            let user = users.find(u=>u.phone===currentUser);
            user.balance += gift.value;
            gift.usedBy = currentUser;
            addTransaction(currentUser,"gift",gift.value,`Redeemed ${code}`);
            saveData(); refreshAllUI();
            document.getElementById("cashGiftModal").style.display="none";
            alert(`Received ${gift.value} ETB!`);
        };
        document.getElementById("closeGiftModal").onclick = () => document.getElementById("cashGiftModal").style.display="none";
        document.getElementById("confirmExchange").onclick = () => {
            let amount = parseFloat(document.getElementById("exchangeAmount").value);
            let user = users.find(u=>u.phone===currentUser);
            if (isNaN(amount)||amount<=0) alert("Enter positive");
            else if (user.wealthWallet<amount) alert("Insufficient wealth");
            else {
                user.wealthWallet -= amount;
                user.balance += amount;
                addTransaction(currentUser,"exchange",amount,"Wealth → balance");
                saveData(); refreshAllUI();
                document.getElementById("exchangeModal").style.display="none";
                alert(`Exchanged ${amount} ETB`);
            }
        };
        document.getElementById("closeExchangeModal").onclick = () => document.getElementById("exchangeModal").style.display="none";
    }, 50);
}
